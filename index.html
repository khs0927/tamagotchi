<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1230">
<title>
🐣 뽀뽀 다마고치 — 2.5D
</title>
<style>
/* ============================================================
RESET & TOKENS ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
--bg-deep: #0f0a1f;
--bg-mid: #1a1230;
--panel: rgba(255,255,255,0.07);
--panel-hi: rgba(255,255,255,0.14);
--stroke: rgba(255,255,255,0.16);
--stroke-hi: rgba(255,255,255,0.32);
--pink: #ff7ab8;
--pink-deep: #e04d8f;
--violet: #a97bff;
--violet-deep: #7c4dff;
--gold: #ffcc5c;
--mint: #7ef0d0;
--sky: #6fc8ff;
--fullness: linear-gradient(90deg,#ffd36e,#ff9f43);
--happiness: linear-gradient(90deg,#ffb3d1,#ff5c9a);
--clean: linear-gradient(90deg,#9be7ff,#28b8f5);
--energy: linear-gradient(90deg,#c9b6ff,#8c6bff);
--ease-spring: cubic-bezier(.34,1.56,.64,1);
--ease-out: cubic-bezier(.16,1,.3,1);
--ease-io: cubic-bezier(.65,0,.35,1);
--shadow-lg: 0 30px 60px -20px rgba(0,0,0,.7), 0 12px 28px -12px rgba(80,40,120,.5);
--shadow-md: 0 12px 28px -8px rgba(0,0,0,.45);
--shadow-btn: 0 6px 0 rgba(0,0,0,.22), 0 10px 22px -6px rgba(0,0,0,.45);
--shadow-inset: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(0,0,0,.25);
}
html, body {
height: 100%;
overflow: hidden;
font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
background: var(--bg-deep);
color: #fff;
user-select: none;
-webkit-user-select: none;
touch-action: manipulation;
}
/* ============================================================
AMBIENT BACKGROUND (behind device) ============================================================ */
body::before {
content: '';
position: fixed; inset: -20%;
background:
radial-gradient(circle at 20% 20%, rgba(169,123,255,.35), transparent 45%),
radial-gradient(circle at 80% 30%, rgba(255,122,184,.30), transparent 45%),
radial-gradient(circle at 50% 90%, rgba(111,200,255,.28), transparent 50%),
radial-gradient(circle at 50% 50%, #1a1230 0%, #0b0718 100%);
filter: blur(60px);
animation: ambientDrift 24s ease-in-out infinite alternate;
z-index: 0;
}
@keyframes ambientDrift
{
0% { transform: scale(1) rotate(0deg); }
50% { transform: scale(1.15) rotate(6deg); }
100% { transform: scale(1.08) rotate(-4deg); }
}
/* Floating dust motes in background */
body::after {
content: '';
position: fixed; inset: 0;
background-image:
radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,.7), transparent),
radial-gradient(1px 1px at 34% 68%, rgba(255,255,255,.5), transparent),
radial-gradient(2px 2px at 78% 18%, rgba(255,255,255,.6), transparent),
radial-gradient(1px 1px at 62% 82%, rgba(255,255,255,.45), transparent),
radial-gradient(1.5px 1.5px at 88% 56%, rgba(255,255,255,.55), transparent),
radial-gradient(1px 1px at 22% 88%, rgba(255,255,255,.4), transparent);
animation: moteDrift 30s linear infinite;
pointer-events: none;
z-index: 1;
opacity: .7;
}
@keyframes moteDrift
{
0% { transform: translateY(0) translateX(0); }
100% { transform: translateY(-80px) translateX(30px); }
}
/* ============================================================
DEVICE SHELL — 2.5D with perspective ============================================================ */
.app {
position: relative;
z-index: 10;
height: 100dvh;
width: 100%;
display: grid;
place-items: center;
padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
perspective: 1400px;
perspective-origin: 50% 45%;
}
.device {
position: relative;
width: min(430px, 100%);
max-height: calc(100dvh - 24px);
display: flex;
flex-direction: column;
border-radius: 36px;
padding: 12px;
background:
linear-gradient(155deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.03) 30%, rgba(0,0,0,.10) 100%),
linear-gradient(180deg, #241a3d 0%, #1a1230 55%, #140d26 100%);
border: 1px solid rgba(255,255,255,.14);
box-shadow:
0 1px 0 rgba(255,255,255,.25) inset,
0 -1px 0 rgba(0,0,0,.5) inset,
0 40px 80px -30px rgba(0,0,0,.85),
0 20px 40px -20px rgba(120,60,180,.55),
0 0 0 8px rgba(255,255,255,.03),
0 0 0 9px rgba(0,0,0,.35);
transform-style: preserve-3d;
transform: rotateX(var(--tiltX, 0deg)) rotateY(var(--tiltY, 0deg));
transition: transform .5s var(--ease-out);
overflow: hidden;
animation: deviceIn 1s var(--ease-out) both;
}
@keyframes deviceIn
{
from { opacity: 0; transform: translateY(30px) scale(.94) rotateX(8deg); }
to { opacity: 1; transform: translateY(0) scale(1) rotateX(0); }
}
/* Specular sheen sweeping across device */
.device::before {
content: '';
position: absolute;
inset: 0;
border-radius: inherit;
background: linear-gradient(115deg,
transparent 30%,
rgba(255,255,255,.10) 45%,
rgba(255,255,255,.20) 50%,
rgba(255,255,255,.10) 55%,
transparent 70%);
background-size: 250% 250%;
background-position: -100% -100%;
pointer-events: none;
mix-blend-mode: screen;
z-index: 100;
animation: sheen 7s ease-in-out infinite 1.5s;
}
@keyframes sheen
{
0%, 60% { background-position: -120% -120%; }
100% { background-position: 220% 220%; }
}
/* ============================================================
TOP HUD — name + stats ============================================================ */
.hud {
position: relative;
z-index: 20;
display: flex;
flex-direction: column;
gap: 10px;
padding: 6px 8px 12px;
flex-shrink: 0;
}
.hud-row {
display: flex;
align-items: center;
justify-content: space-between;
gap: 8px;
}
.name-chip {
display: inline-flex;
align-items: center;
gap: 8px;
padding: 7px 14px 7px 10px;
border-radius: 999px;
background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
border: 1px solid var(--stroke);
box-shadow: var(--shadow-inset), 0 6px 14px -6px rgba(0,0,0,.6);
cursor: pointer;
transition: transform .2s var(--ease-spring), background .2s;
-webkit-backdrop-filter: blur(8px);
backdrop-filter: blur(8px);
}
.name-chip:hover { background: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.08)); }
.name-chip:active { transform: scale(.94); }
.name-chip .dot {
width: 8px; height: 8px; border-radius: 50%;
background: var(--mint);
box-shadow: 0 0 8px var(--mint), 0 0 16px rgba(126,240,208,.6);
animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse
{
0%,100% { opacity: 1; transform: scale(1); }
50% { opacity: .55; transform: scale(.8); }
}
.name-text {
font-size: 13.5px;
font-weight: 800;
letter-spacing: -.2px;
text-shadow: 0 1px 2px rgba(0,0,0,.5);
}
.stage-badge {
font-size: 9.5px;
font-weight: 900;
letter-spacing: .6px;
text-transform: uppercase;
padding: 4px 9px;
border-radius: 999px;
background: linear-gradient(135deg, var(--pink), var(--violet));
color: #fff;
box-shadow: 0 0 0 1px rgba(255,255,255,.25) inset,
0 4px 12px -3px rgba(169,123,255,.8),
0 0 20px -4px rgba(255,122,184,.6);
position: relative;
overflow: hidden;
}
.stage-badge::after {
content: '';
position: absolute; inset: 0;
background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,.7) 50%, transparent 60%);
background-size: 200% 100%;
animation: badgeShine 3s ease-in-out infinite;
}
@keyframes badgeShine
{
0%, 55% { background-position: -100% 0; }
100% { background-position: 200% 0; }
}
.meta {
display: flex;
align-items: center;
gap: 10px;
font-size: 11px;
font-weight: 800;
}
.meta .hp {
color: #ff8fae;
text-shadow: 0 0 10px rgba(255,80,140,.7);
}
.meta .age {
color: rgba(255,255,255,.5);
font-variant-numeric: tabular-nums;
}
/* ============================================================
STAT RINGS ============================================================ */
.stats {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 6px;
padding: 8px 4px 2px;
border-radius: 18px;
background: linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.14));
border: 1px solid rgba(255,255,255,.06);
box-shadow: inset 0 2px 6px rgba(0,0,0,.5), inset 0 -1px 0 rgba(255,255,255,.05);
}
.stat {
display: flex;
flex-direction: column;
align-items: center;
gap: 3px;
position: relative;
}
.stat-ring {
position: relative;
width: 46px; height: 46px;
}
.stat-ring svg {
width: 100%; height: 100%;
transform: rotate(-90deg);
overflow: visible;
}
.stat-ring .trk {
fill: none;
stroke: rgba(255,255,255,.08);
stroke-width: 4;
stroke-linecap: round;
}
.stat-ring .val {
fill: none;
stroke-width: 4;
stroke-linecap: round;
transition: stroke-dashoffset .5s var(--ease-out), stroke .3s;
filter: drop-shadow(0 0 4px currentColor);
}
.stat .icon {
position: absolute; inset: 0;
display: grid; place-items: center;
font-size: 17px;
filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
transition: transform .3s var(--ease-spring);
}
.stat.warn .icon { animation: warnShake .6s ease-in-out infinite; }
@keyframes warnShake
{
0%,100% { transform: rotate(-6deg) scale(1); }
50% { transform: rotate(6deg) scale(1.12); }
}
.stat.warn .stat-ring { animation: warnGlow 1.2s ease-in-out infinite; }
@keyframes warnGlow
{
0%,100% { filter: drop-shadow(0 0 0 rgba(255,60,60,0)); }
50% { filter: drop-shadow(0 0 8px rgba(255,60,60,.9)); }
}
.stat-label {
font-size: 8.5px;
font-weight: 800;
letter-spacing: .4px;
color: rgba(255,255,255,.42);
text-transform: uppercase;
}
/* ============================================================
2.5D STAGE ============================================================ */
.stage {
position: relative;
flex: 1;
min-height: 0;
margin: 10px 0 0;
border-radius: 26px;
overflow: hidden;
isolation: isolate;
transform-style: preserve-3d;
box-shadow:
inset 0 4px 22px rgba(0,0,0,.55),
inset 0 -3px 0 rgba(255,255,255,.10),
inset 0 0 0 1px rgba(255,255,255,.10),
0 20px 40px -18px rgba(0,0,0,.7);
cursor: pointer;
--sky-top: #7ec8ff;
--sky-mid: #b8e2ff;
--sky-low: #ffd6e8;
--ground-hi: #b3ef9e;
--ground-lo: #5fbb63;
--sun-x: 78%;
--sun-y: 16%;
transition: --sky-top 1.5s, --sky-mid 1.5s, --sky-low 1.5s;
animation: stageIn 1s var(--ease-out) .15s both;
}
@keyframes stageIn
{
from { opacity: 0; transform: scale(.96); }
to { opacity: 1; transform: scale(1); }
}
.stage.night {
--sky-top: #0f0b2e;
--sky-mid: #251a52;
--sky-low: #4a2d6b;
--ground-hi: #2c4a3e;
--ground-lo: #10241c;
}
.stage.sick { filter: saturate(.55) hue-rotate(-12deg) brightness(.92); }
/* ---- SKY ---- */
.sky {
position: absolute; inset: 0;
background: linear-gradient(180deg,
var(--sky-top) 0%,
var(--sky-mid) 42%,
var(--sky-low) 68%,
var(--sky-low) 100%);
transition: background 1.2s ease;
}
/* ---- AURORA (night) ---- */
.aurora {
position: absolute; inset: 0 0 40% 0;
opacity: 0;
transition: opacity 1.6s ease;
background:
radial-gradient(60% 40% at 20% 30%, rgba(126,240,208,.35), transparent 60%),
radial-gradient(50% 35% at 70% 20%, rgba(169,123,255,.40), transparent 60%),
radial-gradient(70% 45% at 45% 45%, rgba(255,122,184,.25), transparent 65%);
filter: blur(18px);
mix-blend-mode: screen;
animation: auroraFlow 12s ease-in-out infinite alternate;
}
.stage.night .aurora { opacity: 1; }
@keyframes auroraFlow
{
0% { transform: translateX(-6%) skewX(-4deg) scaleY(1); }
100% { transform: translateX(6%) skewX(4deg) scaleY(1.15); }
}
/* ---- STARS ---- */
.stars {
position: absolute; inset: 0 0 35% 0;
opacity: 0;
transition: opacity 1.4s ease;
}
.stage.night .stars { opacity: 1; }
.star {
position: absolute;
width: 2px; height: 2px;
background: #fff;
border-radius: 50%;
box-shadow: 0 0 4px #fff, 0 0 8px rgba(200,220,255,.8);
animation: twinkle 3s ease-in-out infinite;
}
@keyframes twinkle
{
0%,100% { opacity: .25; transform: scale(.7); }
50% { opacity: 1; transform: scale(1.2); }
}
/* ---- SUN / MOON ---- */
.celestial {
position: absolute;
left: var(--sun-x); top: var(--sun-y);
width: 60px; height: 60px;
margin-left: -30px; margin-top: -30px;
border-radius: 50%;
transition: all 1.2s var(--ease-out);
z-index: 2;
}
.celestial .orb {
position: absolute; inset: 0;
border-radius: 50%;
background: radial-gradient(circle at 34% 32%,
#fffbe0 0%, #ffe066 40%, #ffb020 78%, #ff8c00 100%);
box-shadow:
0 0 30px 8px rgba(255,210,80,.65),
0 0 80px 24px rgba(255,180,60,.35),
inset -8px -8px 16px rgba(220,120,0,.45),
inset 6px 6px 12px rgba(255,255,255,.55);
animation: sunPulse 4s ease-in-out infinite;
}
@keyframes sunPulse
{
0%,100% { transform: scale(1); }
50% { transform: scale(1.05); }
}
.stage.night .celestial .orb {
background: radial-gradient(circle at 36% 34%,
#ffffff 0%, #e8ecff 42%, #b8c0e8 78%, #8890c0 100%);
box-shadow:
0 0 30px 10px rgba(200,215,255,.55),
0 0 70px 26px rgba(150,170,255,.28),
inset -7px -7px 14px rgba(90,100,160,.5),
inset 5px 5px 10px rgba(255,255,255,.85);
}
.stage.night .celestial .orb::after {
content: '';
position: absolute;
inset: 0; border-radius: 50%;
background:
radial-gradient(circle at 62% 34%, rgba(150,160,200,.45) 0 6px, transparent 7px),
radial-gradient(circle at 42% 62%, rgba(150,160,200,.35) 0 4px, transparent 5px),
radial-gradient(circle at 66% 68%, rgba(150,160,200,.30) 0 3px, transparent 4px);
}
/* Sun rays */
.sun-rays {
position: absolute;
left: 50%; top: 50%;
width: 200px; height: 200px;
margin: -100px 0 0 -100px;
border-radius: 50%;
background: conic-gradient(from 0deg,
transparent 0deg, rgba(255,230,140,.18) 8deg, transparent 16deg,
transparent 40deg, rgba(255,230,140,.14) 48deg, transparent 56deg,
transparent 90deg, rgba(255,230,140,.16) 98deg, transparent 106deg,
transparent 140deg, rgba(255,230,140,.14) 148deg, transparent 156deg,
transparent 190deg, rgba(255,230,140,.18) 198deg, transparent 206deg,
transparent 240deg, rgba(255,230,140,.15) 248deg, transparent 256deg,
transparent 290deg, rgba(255,230,140,.17) 298deg, transparent 306deg,
transparent 340deg, rgba(255,230,140,.15) 348deg, transparent 356deg);
animation: raySpin 30s linear infinite;
opacity: .9;
mix-blend-mode: screen;
pointer-events: none;
}
.stage.night .sun-rays { opacity: .18; }
@keyframes raySpin
{
to { transform: rotate(360deg); }
}
/* ---- PARALLAX LAYERS ---- */
.layer {
position: absolute;
inset: 0;
pointer-events: none;
will-change: transform;
}
/* Far mountains */
.mountain-far {
position: absolute;
left: -5%; right: -5%;
bottom: 30%;
height: 34%;
background:
radial-gradient(ellipse 40% 100% at 12% 100%, rgba(120,100,180,.55) 0%, transparent 70%),
radial-gradient(ellipse 50% 110% at 44% 100%, rgba(100,80,160,.60) 0%, transparent 72%),
radial-gradient(ellipse 46% 100% at 78% 100%, rgba(130,110,190,.52) 0%, transparent 70%);
filter: blur(2px);
opacity: .9;
transition: filter .8s, opacity .8s;
}
.stage.night .mountain-far { opacity: .5; filter: blur(3px) brightness(.5); }
/* Near hills */
.mountain-near {
position: absolute;
left: -8%; right: -8%;
bottom: 24%;
height: 26%;
background:
radial-gradient(ellipse 46% 100% at 22% 100%, rgba(90,170,110,.85) 0%, transparent 72%),
radial-gradient(ellipse 52% 105% at 62% 100%, rgba(70,150,95,.90) 0%, transparent 74%);
filter: blur(1px);
transition: filter .8s, opacity .8s;
}
.stage.night .mountain-near { filter: brightness(.42) saturate(.6); }
/* Clouds */
.cloud {
position: absolute;
background: rgba(255,255,255,.92);
border-radius: 999px;
filter: blur(.6px);
transition: background .9s, opacity .9s;
box-shadow: 0 8px 20px -6px rgba(120,150,200,.35);
}
.cloud::before, .cloud::after {
content: ''; position: absolute; background: inherit; border-radius: 50%;
box-shadow: inherit;
}
.stage.night .cloud {
background: rgba(180,190,230,.30);
box-shadow: 0 8px 20px -6px rgba(0,0,0,.4);
}
.cloud.a { width: 78px; height: 26px; top: 20%; left: -30%; animation: drift 34s linear infinite; }
.cloud.a::before { width: 38px; height: 38px; top: -18px; left: 10px; }
.cloud.a::after { width: 30px; height: 30px; top: -13px; left: 40px; }
.cloud.b { width: 58px; height: 20px; top: 38%; left: -30%; animation: drift 48s linear infinite 6s; opacity: .8; }
.cloud.b::before { width: 28px; height: 28px; top: -13px; left: 8px; }
.cloud.b::after { width: 22px; height: 22px; top: -9px; left: 30px; }
.cloud.c { width: 100px; height: 32px; top: 8%; left: -40%; animation: drift 62s linear infinite 14s; opacity: .65; }
.cloud.c::before { width: 46px; height: 46px; top: -22px; left: 12px; }
.cloud.c::after { width: 36px; height: 36px; top: -16px; left: 52px; }
@keyframes drift
{
from { transform: translateX(0); }
to { transform: translateX(600px); }
}
/* Ground */
.ground {
position: absolute;
left: -6%; right: -6%; bottom: -2%;
height: 34%;
background:
radial-gradient(ellipse 120% 100% at 50% 0%, var(--ground-hi) 0%, var(--ground-lo) 78%, transparent 100%);
border-radius: 50% 50% 0 0 / 34% 34% 0 0;
box-shadow:
0 -3px 0 rgba(255,255,255,.30) inset,
0 -6px 20px rgba(255,255,255,.15) inset;
transition: background 1.2s ease;
z-index: 3;
}
.ground::before {
content: '';
position: absolute; inset: 0;
border-radius: inherit;
background:
repeating-linear-gradient(88deg, rgba(255,255,255,.12) 0 2px, transparent 2px 14px),
repeating-linear-gradient(92deg, rgba(0,0,0,.10) 0 2px, transparent 2px 18px);
mask-image: radial-gradient(ellipse 90% 90% at 50% 0%, #000 30%, transparent 75%);
-webkit-mask-image: radial-gradient(ellipse 90% 90% at 50% 0%, #000 30%, transparent 75%);
opacity: .5;
}
/* Grass tufts + flowers (foreground detail) */
.decor {
position: absolute;
inset: 0;
pointer-events: none;
z-index: 4;
}
/* ---- VIGNETTE + LIGHT BLOOM ---- */
.vignette {
position: absolute; inset: 0;
pointer-events: none;
z-index: 60;
background:
radial-gradient(120% 90% at 50% 40%, transparent 45%, rgba(20,10,40,.45) 100%),
radial-gradient(80% 60% at 50% 100%, transparent 40%, rgba(0,0,0,.35) 100%);
}
.bloom {
position: absolute; inset: 0;
pointer-events: none;
z-index: 61;
background: radial-gradient(60% 50% at var(--sun-x) var(--sun-y),
rgba(255,240,180,.28), transparent 60%);
mix-blend-mode: screen;
opacity: .9;
transition: opacity 1s;
}
.stage.night .bloom {
background: radial-gradient(60% 50% at var(--sun-x) var(--sun-y),
rgba(180,200,255,.22), transparent 62%);
}
.stage.sick .bloom { opacity: .25; }
/* ---- FLOOR SHADOW UNDER PET ---- */
.floor-shadow {
position: absolute;
left: 50%; bottom: 19%;
width: 130px; height: 26px;
margin-left: -65px;
background: radial-gradient(ellipse 50% 50% at 50% 50%,
rgba(0,0,0,.55) 0%, rgba(0,0,0,.28) 45%, transparent 75%);
filter: blur(4px);
z-index: 5;
transform-origin: center;
animation: shadowPulse 2.6s ease-in-out infinite;
transition: opacity .4s, transform .3s;
}
@keyframes shadowPulse
{
0%,100% { transform: scaleX(1) scaleY(1); opacity: .85; }
50% { transform: scaleX(.92) scaleY(.88); opacity: .6; }
}
.stage.night .floor-shadow { opacity: .5; }
/* ============================================================
PET (2.5D with perspective tilt) ============================================================ */
.pet-wrap {
position: absolute;
left: 50%;
bottom: 16%;
width: 150px;
margin-left: -75px;
z-index: 8;
transform-style: preserve-3d;
transition: transform .5s var(--ease-out);
}
.pet-tilt {
position: relative;
transform-style: preserve-3d;
transition: transform .6s var(--ease-out);
animation: idleBob 2.8s ease-in-out infinite;
transform-origin: bottom center;
}
@keyframes idleBob
{
0%,100% { transform: translateY(0) rotateX(0deg); }
50% { transform: translateY(-9px) rotateX(-2deg); }
}
.pet-tilt.anim-eat { animation: chew .28s ease-in-out 6; }
.pet-tilt.anim-hop { animation: hop .46s var(--ease-out) 2; }
.pet-tilt.anim-shake{ animation: shake .32s ease-in-out 3; }
.pet-tilt.anim-love { animation: wiggle .5s var(--ease-spring) 2; }
@keyframes chew
{ 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.08,.92); } }
@keyframes hop
{ 0%,100% { transform: translateY(0) scale(1,1); } 40% { transform: translateY(-24px) scale(.93,1.08); } }
@keyframes shake
{ 0%,100% { transform: rotate(0) translateX(0); } 25% { transform: rotate(-7deg) translateX(-4px); } 75% { transform: rotate(7deg) translateX(4px); } }
@keyframes wiggle
{ 0%,100% { transform: rotate(0); } 30% { transform: rotate(-8deg); } 70% { transform: rotate(8deg); } }
/* Aura glow behind pet */
.pet-aura {
position: absolute;
left: 50%; top: 50%;
width: 240px; height: 240px;
margin: -120px 0 0 -120px;
border-radius: 50%;
background: radial-gradient(circle,
rgba(255,200,230,.45) 0%,
rgba(200,150,255,.20) 35%,
transparent 70%);
filter: blur(12px);
z-index: -1;
animation: auraPulse 3.5s ease-in-out infinite;
transition: opacity .6s;
}
@keyframes auraPulse
{
0%,100% { transform: scale(1); opacity: .8; }
50% { transform: scale(1.15); opacity: 1; }
}
.stage.night .pet-aura {
background: radial-gradient(circle,
rgba(160,220,255,.5) 0%,
rgba(140,120,255,.28) 40%,
transparent 72%);
}
.stage.sick .pet-aura {
background: radial-gradient(circle, rgba(160,160,180,.35), transparent 70%);
animation-duration: 5s;
}
.pet-svg {
width: 100%;
display: block;
transform-origin: bottom center;
filter:
drop-shadow(0 10px 14px rgba(90,40,110,.35))
drop-shadow(0 2px 4px rgba(0,0,0,.2));
transition: filter .5s, opacity .4s;
}
.pet-svg.sleeping { filter: drop-shadow(0 10px 14px rgba(90,40,110,.35)) brightness(.82) saturate(.7); }
.egg-svg {
width: 100%;
display: block;
transform-origin: bottom center;
animation: eggWobble 2.4s ease-in-out infinite;
filter:
drop-shadow(0 10px 14px rgba(90,40,110,.35))
drop-shadow(0 2px 4px rgba(0,0,0,.2));
}
@keyframes eggWobble
{
0%, 100% { transform: rotate(0deg) scale(1); }
12% { transform: rotate(-8deg) scale(1.01); }
26% { transform: rotate(7deg) scale(1.01); }
40% { transform: rotate(-5deg) scale(1); }
55% { transform: rotate(0deg) scale(1); }
}
/* ============================================================
POOPS (2.5D) ============================================================ */
.poops {
position: absolute;
left: 0; right: 0; bottom: 12%;
height: 44px;
pointer-events: none;
z-index: 6;
}
.poop {
position: absolute;
bottom: 0;
font-size: 22px;
filter: drop-shadow(0 4px 4px rgba(0,0,0,.35));
animation: poopIn .45s var(--ease-spring) both,
poopFloat 2.6s ease-in-out infinite .5s;
transform-origin: bottom center;
}
@keyframes poopIn
{
from { transform: scale(0) translateY(-20px) rotate(-30deg); opacity: 0; }
to { transform: scale(1) translateY(0) rotate(0); opacity: 1; }
}
@keyframes poopFloat
{
0%,100% { transform: translateY(0) rotate(0); }
50% { transform: translateY(-3px) rotate(3deg); }
}
/* ============================================================
ZZZ + BUBBLES ============================================================ */
.zzz-layer {
position: absolute;
top: 12%; right: 20%;
width: 60px; height: 80px;
pointer-events: none;
z-index: 9;
}
.zzz-layer .z {
position: absolute;
font-size: 20px;
font-weight: 900;
color: #fff;
text-shadow: 0 0 12px rgba(150,200,255,.9), 0 2px 4px rgba(0,0,0,.4);
opacity: 0;
}
.stage.sleeping .zzz-layer .z { animation: zFloat 2.6s ease-in-out infinite; }
.zzz-layer .z:nth-child(1) { animation-delay: 0s; left: 0; top: 40px; font-size: 15px; }
.zzz-layer .z:nth-child(2) { animation-delay: .55s; left: 14px; top: 22px; font-size: 19px; }
.zzz-layer .z:nth-child(3) { animation-delay: 1.1s; left: 30px; top: 0; font-size: 24px; }
@keyframes zFloat
{
0% { opacity: 0; transform: translateY(6px) scale(.6) rotate(-8deg); }
25% { opacity: 1; }
100% { opacity: 0; transform: translateY(-34px) scale(1.15) rotate(10deg); }
}
/* ============================================================
SPEECH BUBBLE ============================================================ */
.bubble {
position: absolute;
top: 10px; left: 50%;
transform: translate(-50%, -8px) scale(.82);
background: rgba(255,255,255,.96);
color: #3a2b52;
font-size: 12.5px;
font-weight: 800;
letter-spacing: -.2px;
padding: 9px 15px;
border-radius: 999px;
white-space: nowrap;
max-width: 90%;
overflow: hidden;
text-overflow: ellipsis;
box-shadow:
0 10px 24px -8px rgba(0,0,0,.55),
0 2px 0 rgba(255,255,255,.7) inset,
0 0 0 1px rgba(255,255,255,.35);
opacity: 0;
pointer-events: none;
transition: all .34s var(--ease-spring);
z-index: 40;
-webkit-backdrop-filter: blur(6px);
backdrop-filter: blur(6px);
}
.bubble.show {
opacity: 1;
transform: translate(-50%, 0) scale(1);
}
.bubble::after {
content: '';
position: absolute;
bottom: -6px; left: 50%;
width: 10px; height: 10px;
margin-left: -5px;
background: inherit;
transform: rotate(45deg);
border-radius: 0 0 3px 0;
box-shadow: 2px 2px 4px -2px rgba(0,0,0,.3);
}
/* ============================================================
PARTICLES ============================================================ */
.particles {
position: absolute; inset: 0;
pointer-events: none;
z-index: 30;
overflow: hidden;
}
.p {
position: absolute;
font-size: 18px;
will-change: transform, opacity;
pointer-events: none;
font-weight: 900;
}
.p.rise {
animation: pRise 1.1s var(--ease-out) forwards;
}
@keyframes pRise
{
0% { transform: translate(0, 0) scale(.5) rotate(0); opacity: 0; }
20% { transform: translate(calc(var(--dx,0)*.3), -12px) scale(1.15) rotate(0); opacity: 1; }
100% { transform: translate(var(--dx,0), -90px) scale(.85) rotate(var(--rot,0deg)); opacity: 0; }
}
.p.burst {
animation: pBurst .95s var(--ease-out) forwards;
}
@keyframes pBurst
{
0% { transform: translate(0,0) scale(.6); opacity: 1; }
100% { transform: translate(var(--dx,0), var(--dy,-70px)) scale(1) rotate(var(--rot,0)); opacity: 0; }
}
.p.drop {
animation: pDrop 1.15s var(--ease-out) forwards;
}
@keyframes pDrop
{
0% { transform: translate(0,-30px) scale(.7); opacity: 1; }
70% { transform: translate(var(--dx,0), var(--dy, 40px)) scale(1); opacity: 1; }
100% { transform: translate(var(--dx,0), var(--dy, 60px)) scale(.9); opacity: 0; }
}
/* Screen flash */
.flash {
position: absolute; inset: 0;
pointer-events: none;
background: radial-gradient(circle at 50% 55%, rgba(255,255,255,.95), transparent 60%);
opacity: 0;
z-index: 70;
}
.flash.on { animation: flashAnim .55s ease-out; }
@keyframes flashAnim
{
0% { opacity: 0; }
15% { opacity: 1; }
100% { opacity: 0; }
}
/* ============================================================
ACTION BAR ============================================================ */
.actions {
position: relative;
z-index: 20;
display: grid;
gap: 8px;
padding: 12px 4px 4px;
flex-shrink: 0;
}
.actions-row {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 8px;
}
.actions-row.med { grid-template-columns: 1fr; }
.btn {
position: relative;
border: none;
border-radius: 18px;
padding: 10px 4px 9px;
font-family: inherit;
font-size: 10.5px;
font-weight: 900;
letter-spacing: .2px;
color: #fff;
cursor: pointer;
display: flex;
flex-direction: column;
align-items: center;
gap: 4px;
isolation: isolate;
overflow: hidden;
background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
border: 1px solid rgba(255,255,255,.14);
box-shadow:
0 1px 0 rgba(255,255,255,.22) inset,
0 -2px 0 rgba(0,0,0,.25) inset,
0 8px 0 -2px rgba(0,0,0,.35),
0 12px 22px -8px rgba(0,0,0,.55);
transition: transform .12s var(--ease-out),
box-shadow .12s var(--ease-out),
background .25s;
-webkit-tap-highlight-color: transparent;
}
.btn::before {
content: '';
position: absolute;
inset: 0;
border-radius: inherit;
background: linear-gradient(180deg, rgba(255,255,255,.28), transparent 50%);
pointer-events: none;
z-index: 2;
}
.btn::after {
content: '';
position: absolute;
left: 50%; top: 50%;
width: 0; height: 0;
background: radial-gradient(circle, rgba(255,255,255,.7), transparent 70%);
border-radius: 50%;
transform: translate(-50%,-50%);
transition: width .4s ease-out, height .4s ease-out, opacity .4s;
opacity: 0;
pointer-events: none;
}
.btn:active:not(:disabled)::after {
width: 200px; height: 200px;
opacity: .5;
transition: 0s;
}
.btn:hover:not(:disabled) {
background: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.07));
}
.btn:active:not(:disabled) {
transform: translateY(6px);
box-shadow:
0 1px 0 rgba(255,255,255,.22) inset,
0 -2px 0 rgba(0,0,0,.25) inset,
0 2px 0 -1px rgba(0,0,0,.35),
0 4px 10px -4px rgba(0,0,0,.5);
}
.btn:disabled {
opacity: .35;
cursor: not-allowed;
filter: saturate(.3);
}
.btn .emoji {
font-size: 21px;
line-height: 1;
filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
transition: transform .3s var(--ease-spring);
}
.btn:hover:not(:disabled) .emoji { transform: scale(1.15) rotate(-5deg); }
.btn:active:not(:disabled) .emoji { transform: scale(1.05); }
/* Special styles */
.btn.feed { --c1: #ff9f43; --c2: #e67e22;
background: linear-gradient(180deg, rgba(255,159,67,.35), rgba(230,126,34,.18)); }
.btn.play { --c1: #ff5c9a; --c2: #d63384;
background: linear-gradient(180deg, rgba(255,92,154,.35), rgba(214,51,132,.18)); }
.btn.wash { --c1: #28b8f5; --c2: #0d8ddb;
background: linear-gradient(180deg, rgba(40,184,245,.35), rgba(13,141,219,.18)); }
.btn.sleep { --c1: #8c6bff; --c2: #6a4ddb;
background: linear-gradient(180deg, rgba(140,107,255,.35), rgba(106,77,219,.18)); }
.btn.sleep.active {
background: linear-gradient(180deg, rgba(255,204,92,.45), rgba(255,159,67,.25));
box-shadow:
0 1px 0 rgba(255,255,255,.22) inset,
0 -2px 0 rgba(0,0,0,.25) inset,
0 8px 0 -2px rgba(180,100,0,.5),
0 12px 22px -8px rgba(255,159,67,.6),
0 0 30px -4px rgba(255,204,92,.7);

@keyframes sleepPulse
{

50% { filter: brightness(1.15); }
}
.btn.med {

font-size: 12px;

animation: medPulse 1.6s ease-in-out infinite;
}
@keyframes medPulse
{
0%,100% { box-shadow:
0 1px 0 rgba(255,255,255,.22) inset,
0 -2px 0 rgba(0,0,0,.25) inset,
0 8px 0 -2px rgba(0,60,50,.35),

50% { box-shadow:
0 1px 0 rgba(255,255,255,.22) inset,
0 -2px 0 rgba(0,0,0,.25) inset,
0 8px 0 -2px rgba(0,60,50,.35),
0 12px 22px -8px rgba(0,0,0,.55),

/* ============================================================
HINT ============================================================ */
.hint {

font-weight: 700;
color: rgba(255,255,255,.32);

.hint kbd {

font-size: 9px;
font-weight: 900;
color: rgba(255,255,255,.6);

}
/* ============================================================
OVERLAY (game over / evolve) ============================================================ */
.overlay {
position: absolute;
inset: 0;
border-radius: 26px;
background: radial-gradient(circle at 50% 40%,
rgba(30,15,60,.85) 0%, rgba(10,5,25,.94) 100%);
-webkit-backdrop-filter: blur(14px) saturate(.6);
backdrop-filter: blur(14px) saturate(.6);
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 12px;
z-index: 80;
padding: 24px;
text-align: center;
}
.overlay.show {
display: flex;
animation: overlayIn .55s var(--ease-out);
}
@keyframes overlayIn
{
from { opacity: 0; transform: scale(1.05); }
to { opacity: 1; transform: scale(1); }
}
.overlay .ghost {
font-size: 74px;
filter: drop-shadow(0 0 30px rgba(180,150,255,.8));
animation: ghostFloat 3s ease-in-out infinite;
}
@keyframes ghostFloat
{
0%,100% { transform: translateY(0) rotate(-4deg); }
50% { transform: translateY(-16px) rotate(4deg); }
}
.overlay h2 {
font-size: 19px;
font-weight: 900;
letter-spacing: -.4px;
background: linear-gradient(135deg, #ffb8d9, #b79cff);
-webkit-background-clip: text;
background-clip: text;
color: transparent;
text-shadow: 0 0 30px rgba(180,140,255,.4);
}
.overlay p {

line-height: 1.65;

}
.restart-btn {

border: none;
cursor: pointer;
font-family: inherit;
font-size: 14px;
font-weight: 900;
letter-spacing: -.2px;
color: #fff;
padding: 14px 34px;

0 1px 0 rgba(255,255,255,.4) inset,
0 8px 0 -2px rgba(80,20,120,.6),
0 16px 30px -10px rgba(169,123,255,.9),
0 0 40px -6px rgba(255,122,184,.7);

overflow: hidden;
}
.restart-btn::before {
content: '';
position: absolute; inset: 0;

background-size: 220% 100%;
background-position: -100% 0;

}
@keyframes btnShine
{

100% { background-position: 220% 0; }
}

0 2px 0 -1px rgba(80,20,120,.6),

SOUND TOGGLE ============================================================ */
.sound-toggle {
position: absolute;
top: 14px; right: 14px;
width: 34px; height: 34px;
border-radius: 50%;
border: 1px solid rgba(255,255,255,.14);
background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
-webkit-backdrop-filter: blur(10px);
backdrop-filter: blur(10px);
cursor: pointer;
font-size: 15px;
display: grid;
place-items: center;
z-index: 90;
box-shadow: 0 1px 0 rgba(255,255,255,.22) inset, 0 6px 14px -6px rgba(0,0,0,.6);
transition: transform .2s var(--ease-spring), background .2s;
color: #fff;
}
.sound-toggle:hover { background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.08)); }
.sound-toggle:active { transform: scale(.9); }
.sound-toggle.off { opacity: .5; }
/* ============================================================
DEVICE SHAKE / FLASH ============================================================ */
.device.shake-sm { animation: shakeSm .35s ease-in-out; }
.device.shake-md { animation: shakeMd .55s ease-in-out; }
.device.shake-lg { animation: shakeLg .75s ease-in-out; }
@keyframes shakeSm
{
0%,100% { transform: translate(0,0) rotateX(0); }
20% { transform: translate(-3px,2px) rotateZ(-.6deg); }
40% { transform: translate(3px,-2px) rotateZ(.6deg); }
60% { transform: translate(-2px,1px) rotateZ(-.3deg); }
80% { transform: translate(2px,-1px) rotateZ(.3deg); }
}
@keyframes shakeMd
{
0%,100% { transform: translate(0,0); }
15% { transform: translate(-6px,4px) rotateZ(-1.2deg); }
30% { transform: translate(6px,-4px) rotateZ(1.2deg); }
45% { transform: translate(-5px,3px) rotateZ(-.9deg); }
60% { transform: translate(5px,-3px) rotateZ(.9deg); }
80% { transform: translate(-2px,1px); }
}
@keyframes shakeLg
{
0%,100% { transform: translate(0,0) scale(1); }
10% { transform: translate(-9px,6px) rotateZ(-1.8deg) scale(1.01); }
25% { transform: translate(9px,-6px) rotateZ(1.8deg) scale(1.01); }
40% { transform: translate(-7px,5px) rotateZ(-1.4deg); }
55% { transform: translate(7px,-5px) rotateZ(1.4deg); }
70% { transform: translate(-4px,2px) rotateZ(-.7deg); }
85% { transform: translate(4px,-2px) rotateZ(.7deg); }
}
/* ============================================================
FLOATING SCORE TEXT ============================================================ */
.float-text {
position: absolute;
font-size: 17px;
font-weight: 900;
letter-spacing: -.3px;
color: #fff;
text-shadow:
0 0 12px rgba(255,255,255,.7),
0 2px 6px rgba(0,0,0,.6),
0 0 20px var(--c, rgba(255,200,255,.9));
pointer-events: none;
z-index: 50;
animation: floatUp 1.25s var(--ease-out) forwards;
white-space: nowrap;
}
@keyframes floatUp
{
0% { transform: translate(-50%, 0) scale(.5); opacity: 0; }
22% { transform: translate(-50%, -18px) scale(1.2); opacity: 1; }
100% { transform: translate(-50%, -80px) scale(1); opacity: 0; }
}
/* ============================================================
RESPONSIVE ============================================================ */
@media (max-height: 720px)
{
.stat-ring { width: 40px; height: 40px; }

@media (prefers-reduced-motion: reduce)
{
*, *::before, *::after {
animation-duration: .01ms !important;
animation-iteration-count: 1 !important;
transition-duration: .01ms !important;
}
}

<script>
(() => {
'use strict';
/* ========================================================
CONSTANTS & STATE ======================================================== */
const SAVE_KEY = 'tamagotchi-ppoppo-2.5d';
const STAGES = { egg: '알', baby: '아기', child: '어린이', adult: '어른' };
const STAGE_SCALE = { egg: 1, baby: 0.72, child: 0.88, adult: 1.0 };
const RING_CIRC = 2 * Math.PI * 19; // r=19
function makeDefault() {
return {
name: '뽀뽀',
age: 0,
fullness: 78,
happiness: 82,
clean: 90,
energy: 88,
health: 100,
poops: 0,
sleeping: false,
alive: true,
poopTimer: 0,
poopNext: 22,
stage: 'egg',
soundOn: true,
mood: '기분 좋음'
};
}
let S = makeDefault();
/* ========================================================
DOM ======================================================== */
const $ = id => document.getElementById(id);
const device = $('device');
const stageEl = $('stage');
const skyEl = stageEl.querySelector('.sky');
const bubbleEl = $('bubble');
const poopsEl = $('poops');
const zzzLayer = $('zzzLayer');
const particles = $('particles');
const flashEl = $('flash');
const petWrap = $('petWrap');
const petTilt = $('petTilt');
const petSvg = $('petSvg');
const eggSvg = $('eggSvg');
const bodyGroup = $('petBodyGroup');
const mouthPath = $('mouthPath');
const mouthOpen = $('mouthOpen');
const mouthTongue= $('mouthTongue');
const eyesOpen = $('eyesOpen');
const eyesClosed = $('eyesClosed');
const eyesX = $('eyesX');
const armL = $('armL');
const armR = $('armR');
const nameText = $('nameText');
const stageBadge = $('stageBadge');
const ageText = $('ageText');
const hpText = $('hpText');
const moodText = $('moodText');
const overlay = $('overlay');
const medRow = $('medRow');
const starsEl = $('stars');
const decorEl = $('decor');
const floorShadow= $('floorShadow');
const rings = {
fullness: $('r-fullness'),
happiness: $('r-happiness'),
clean: $('r-clean'),
energy: $('r-energy')
};
const statEls = {
fullness: document.querySelector('[data-stat="fullness"]'),
happiness: document.querySelector('[data-stat="happiness"]'),
clean: document.querySelector('[data-stat="clean"]'),
energy: document.querySelector('[data-stat="energy"]')
};
const btnFeed = $('btnFeed');
const btnPlay = $('btnPlay');
const btnWash = $('btnWash');
const btnSleep = $('btnSleep');
const btnMed = $('btnMed');
/* ========================================================
AUDIO ENGINE ======================================================== */
let audioCtx = null;
function ensureAudio() {
if (!audioCtx) {
try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
return audioCtx;
}
function beep(freq, dur = 0.09, type = 'sine', vol = 0.05) {
if (!S.soundOn) return;
const ac = ensureAudio(); if (!ac) return;
try {
const o = ac.createOscillator(), g = ac.createGain();
o.type = type; o.frequency.value = freq;
const t = ac.currentTime;
g.gain.setValueAtTime(0, t);
g.gain.linearRampToValueAtTime(vol, t + 0.012);
g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
o.connect(g); g.connect(ac.destination);
o.start(t); o.stop(t + dur + 0.03);
} catch(e) {}
}
function melody(notes) {
notes.forEach((
[f, t, d]
) => setTimeout(() => beep(f, d || 0.1, 'triangle', 0.055), t));
}
function noiseBurst(
dur = 0.35, vol = 0.03
) {
if (!S.soundOn) return;
const ac = ensureAudio(); if (!ac) return;
try {
const bufSize = ac.sampleRate * dur;
const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
const data = buf.getChannelData(0);
for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
const src = ac.createBufferSource(); src.buffer = buf;
const g = ac.createGain(); g.gain.value = vol;
const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.8;
src.connect(f); f.connect(g); g.connect(ac.destination);
src.start();
} catch(e) {}
}
/* ========================================================
HAPTICS ======================================================== */
function haptic(pattern) {
if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch(e) {} }
}
/* ========================================================
SAVE / LOAD ======================================================== */
function save() {
try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) {}
}
function load() {
try {
const raw = localStorage.getItem(SAVE_KEY);
if (!raw) return;
const d = JSON.parse(raw);
if (d && typeof d === 'object') {
S = Object.assign(makeDefault(), d);
S.health = Math.max(S.health, 20);
S.stage = stageOf(S.age);
}
} catch(e) {}
}
/* ========================================================
UTIL ======================================================== */
const clamp = (
v, a = 0, b = 100
) => Math.max(a, Math.min(b, v));
const rand = (
a, b
) => a + Math.random() * (b - a);
function stageOf(age) {
if (age < 15) return 'egg';
if (age < 90) return 'baby';
if (age < 240) return 'child';
return 'adult';
}
function formatAge(sec) {
sec = Math.floor(sec);
if (sec < 60) return sec + '초';
const m = Math.floor(sec / 60);
if (m < 60) return m + '분 ' + (sec % 60) + '초';
return Math.floor(m / 60) + '시간 ' + (m % 60) + '분';
}
/* ========================================================
BUBBLE ======================================================== */
let bubbleTimer = null;
function say(
text, ms = 2200
) {
bubbleEl.textContent = text;
bubbleEl.classList.add('show');
clearTimeout(bubbleTimer);
bubbleTimer = setTimeout(() => bubbleEl.classList.remove('show'), ms);
}
/* ========================================================
PARTICLES ======================================================== */
const HEART_EMOJI = ['💕','💖','✨','💗','💞','⭐'];
const FOOD_EMOJI = ['🍚','🍙','🍎','🍪','🍖'];
const BUBBLE_EMOJI = ['🫧','✨','💧','🫧'];
const SPARK_EMOJI = ['✨','⭐','🌟','💫','✨'];
function spawnParticle(opts) {
const el = document.createElement('div');
el.className = 'p ' + (opts.kind || 'rise');
el.textContent = opts.char;
el.style.left = opts.x + '%';
el.style.top = opts.y + '%';
el.style.setProperty('--dx', (opts.dx || 0) + 'px');
el.style.setProperty('--dy', (opts.dy || 0) + 'px');
el.style.setProperty('--rot', (opts.rot || 0) + 'deg');
el.style.fontSize = (opts.size || 18) + 'px';
el.style.filter =
`drop-shadow(0 2px 4px rgba(0,0,0,.35)) drop-shadow(0 0 8px
${opts.glow || 'rgba(255,200,255,.6)'}
)`
;
particles.appendChild(el);
setTimeout(() => el.remove(), 1300);
}
function burstHearts(
n = 4, cx = 50, cy = 42
) {
for (let i = 0; i < n; i++) {
setTimeout(() => {
spawnParticle({
kind: 'rise',
char: HEART_EMOJI[Math.floor(Math.random() * HEART_EMOJI.length)],
x: cx + rand(-12, 12),
y: cy + rand(-8, 8),
dx: rand(-40, 40),
size: rand(14, 22),
glow: 'rgba(255,120,180,.85)'
});
}, i * 80);
}
}
function burstSparkles(
n = 8, cx = 50, cy = 45
) {
for (let i = 0; i < n; i++) {
setTimeout(() => {
const ang = rand(0, Math.PI * 2);
const dist = rand(30, 70);
spawnParticle({
kind: 'burst',
char: SPARK_EMOJI[Math.floor(Math.random() * SPARK_EMOJI.length)],
x: cx, y: cy,
dx: Math.cos(ang) * dist,
dy: Math.sin(ang) * dist - 20,
rot: rand(-180, 180),
size: rand(12, 22),
glow: 'rgba(255,220,120,.9)'
});
}, i * 30);
}
}
function dropFood(
n = 5
) {
for (let i = 0; i < n; i++) {
setTimeout(() => {
spawnParticle({
kind: 'drop',
char: FOOD_EMOJI[Math.floor(Math.random() * FOOD_EMOJI.length)],
x: rand(42, 58), y: 15,
dx: rand(-20, 20), dy: 55,
size: rand(14, 20),
glow: 'rgba(255,180,90,.8)'
});
}, i * 110);
}
}
function floatBubbles(
n = 6
) {
for (let i = 0; i < n; i++) {
setTimeout(() => {
spawnParticle({
kind: 'rise',
char: BUBBLE_EMOJI[Math.floor(Math.random() * BUBBLE_EMOJI.length)],
x: rand(35, 65), y: rand(55, 80),
dx: rand(-30, 30),
size: rand(14, 22),
glow: 'rgba(150,230,255,.9)'
});
}, i * 70);
}
}
function floatText(
txt, color
) {
const el = document.createElement('div');
el.className = 'float-text';
el.textContent = txt;
el.style.left = rand(40, 60) + '%';
el.style.top = rand(38, 48) + '%';
if (color) el.style.setProperty('--c', color);
stageEl.appendChild(el);
setTimeout(() => el.remove(), 1300);
}
function screenFlash() {
flashEl.classList.remove('on');
void flashEl.offsetWidth;
flashEl.classList.add('on');
}
function shakeDevice(size = 'sm') {
device.classList.remove('shake-sm', 'shake-md', 'shake-lg');
void device.offsetWidth;
device.classList.add('shake-' + size);
setTimeout(() => device.classList.remove('shake-' + size), 800);
}
function playAnim(
cls, dur
) {
petTilt.classList.remove('anim-eat', 'anim-hop', 'anim-shake', 'anim-love');
void petTilt.offsetWidth;
petTilt.classList.add(cls);
setTimeout(() => petTilt.classList.remove(cls), dur);
}
/* ========================================================
STARS & DECOR ======================================================== */
function buildStars() {
const frag = document.createDocumentFragment();
for (let i = 0; i < 42; i++) {
const s = document.createElement('div');
s.className = 'star';
s.style.left = rand(0, 100) + '%';
s.style.top = rand(0, 100) + '%';
s.style.animationDelay = rand(0, 3) + 's';
s.style.animationDuration = rand(2, 4.5) + 's';
const sz = rand(1, 2.6);
s.style.width = sz + 'px';
s.style.height = sz + 'px';
frag.appendChild(s);
}
starsEl.appendChild(frag);
}
function buildDecor() {
const frag = document.createDocumentFragment();
// flowers + grass tufts along the ground
const items = ['🌷','🌼','🌸','🌿','🍀','🌱','🌻','🌾'];
for (let i = 0; i < 9; i++) {
const d = document.createElement('div');
d.textContent = items[i % items.length];
d.style.position = 'absolute';
d.style.left = rand(4, 92) + '%';
d.style.bottom = rand(2, 12) + '%';
d.style.fontSize = rand(11, 17) + 'px';
d.style.opacity = 0.85;
d.style.filter = 'drop-shadow(0 2px 2px rgba(0,0,0,.3))';
d.style.transform =
`scale(
${rand(.85, 1.2)}
)`
;
frag.appendChild(d);
}
decorEl.appendChild(frag);
}
/* ========================================================
GAME LOGIC ======================================================== */
function update(dt) {
const prevStage = S.stage;
S.age += dt;
const sleeping = S.sleeping;
// drains
S.fullness -= (sleeping ? 0.055 : 0.30) * dt;
S.happiness -= (sleeping ? 0.070 : 0.23) * dt;
S.clean -= (sleeping ? 0.045 : 0.15) * dt;
S.energy += (sleeping ? 0.85 : -0.19) * dt;
S.clean -= S.poops * 0.10 * dt;
S.fullness = clamp(S.fullness);
S.happiness = clamp(S.happiness);
S.clean = clamp(S.clean);
S.energy = clamp(S.energy);
// poop
if (!sleeping && S.fullness > 12) {
S.poopTimer += dt;
if (S.poopTimer >= S.poopNext) {
S.poopTimer = 0;
S.poopNext = 24 + Math.random() * 26;
if (S.poops < 4) {
S.poops++;
beep(180, 0.12, 'square', 0.035);
}
}
}
// health
let drain = 0;
if (S.fullness <= 0.5) drain += 0.60;
if (S.happiness <= 0.5) drain += 0.45;
if (S.clean <= 0.5) drain += 0.40;
if (S.energy <= 0.5) drain += 0.40;
if (S.poops >= 3) drain += 0.25;
if (drain > 0) {
S.health = clamp(S.health - drain * dt);
} else if (S.fullness > 45 && S.happiness > 45 && S.clean > 45 && S.energy > 45) {
S.health = clamp(S.health + 0.45 * dt);
}
// auto sleep
if (!sleeping && S.energy <= 3) {
S.sleeping = true;
say('너무 졸려... 쿨쿨 💤', 2600);
beep(400, 0.2, 'sine', 0.04);
}
// evolve
const newStage = stageOf(S.age);
if (newStage !== prevStage) {
S.stage = newStage;
onEvolve(newStage);
}
// death
if (S.health <= 0) {
S.health = 0;
S.alive = false;
onDeath();
}
// mood text
if (sleeping) S.mood = '쿨쿨 자는 중';
else if (S.health < 35) S.mood = '많이 아파요...';
else if (S.fullness < 30) S.mood = '배고파요 🥺';
else if (S.happiness < 30) S.mood = '심심해요...';
else if (S.clean < 30) S.mood = '지저분해요 🫧';
else if (S.energy < 30) S.mood = '졸려요...';
else if (S.happiness > 75 && S.health > 75) S.mood = '아주 행복해요! ✨';
else S.mood = '기분 좋음';
}
function onEvolve(stage) {
screenFlash();
shakeDevice('md');
haptic([30, 40, 30]);
if (stage === 'baby') {
melody([[523,0,.12],[659,110,.12],[784,220,.12],[1047,340,.28]]);
say('안녕! 나는 ' + S.name + '야 🐣', 3000);
floatText('부화! 🎉', 'rgba(255,220,120,.95)');
burstSparkles(14, 50, 45);
burstHearts(5, 50, 42);
} else if (stage === 'child') {
melody([[659,0,.12],[784,100,.12],[988,200,.28]]);
say('나 이제 어린이야! 쑥쑥 크는 중 🌱', 3000);
floatText('진화! ⭐', 'rgba(180,255,200,.95)');
burstSparkles(18, 50, 45);
burstHearts(6, 50, 42);
} else if (stage === 'adult') {
melody([[784,0,.12],[988,110,.12],[1175,220,.12],[1568,340,.4]]);
say('어른이 됐어! 멋지지? 👑', 3200);
floatText('성장 완료! 👑', 'rgba(255,200,255,.95)');
burstSparkles(24, 50, 45);
burstHearts(8, 50, 42);
}
}
function onDeath() {
overlay.classList.add('show');
shakeDevice('lg');
haptic([60, 80, 60, 80, 120]);
melody([[440,0,.28],[370,240,.28],[294,480,.5]]);
save();
}
/* ========================================================
ACTIONS ======================================================== */
function canAct() {
if (!S.alive) return false;
if (S.stage === 'egg') {
say('아직 알 속에 있어요... 🥚', 1800);
playAnim('anim-shake', 900);
beep(500, 0.07, 'triangle', 0.04);
return false;
}
if (S.sleeping) {
say('쿨쿨... 자는 중이에요 💤', 1800);
return false;
}
return true;
}
function feed() {
if (!canAct()) return;
if (S.fullness >= 98) {
say('배불러~ 더는 못 먹어! 🤢', 2000);
playAnim('anim-shake', 900);
shakeDevice('sm');
return;
}
S.fullness = clamp(S.fullness + 22);
S.happiness = clamp(S.happiness + 4);
S.energy = clamp(S.energy + 3);
say('냠냠! 맛있어~ 🍚', 1800);
playAnim('anim-eat', 1700);
dropFood(6);
melody([[620,0],[760,100],[900,200]]);
floatText('+22 🍚', 'rgba(255,190,110,.95)');
burstHearts(2, 55, 55);
haptic(12);
save();
}
function play() {
if (!canAct()) return;
if (S.energy <= 8) {
say('너무 지쳐서 못 놀아... 😵', 2000);
playAnim('anim-shake', 900);
return;
}
S.happiness = clamp(S.happiness + 20);
S.energy = clamp(S.energy - 11);
S.fullness = clamp(S.fullness - 6);
S.clean = clamp(S.clean - 5);
say('신나신나! 🎾💨', 1800);
playAnim('anim-hop', 1000);
melody([[700,0],[880,90],[1050,180],[880,270]]);
floatText('+20 😊', 'rgba(255,140,190,.95)');
burstHearts(5, 50, 42);
haptic(15);
save();
}
function wash() {
if (!S.alive) return;
if (S.stage === 'egg') { canAct(); return; }
if (S.sleeping) { say('자는 동안엔 씻기지 마세요 💤', 1800); return; }
const wasDirty = S.poops > 0 || S.clean < 60;
S.clean = 100;
S.poops = 0;
say(wasDirty ? '뽀득뽀득~ 깨끗해졌다! ✨' : '이미 반짝반짝해 ✨', 1900);
playAnim('anim-hop', 900);
floatBubbles(9);
noiseBurst(0.4, 0.035);
melody([[900,0],[1200,80],[1500,160]]);
floatText('청결 MAX ✨', 'rgba(150,230,255,.95)');
haptic(10);
save();
}
function toggleSleep() {
if (!S.alive) return;
if (S.stage === 'egg') { say('아직 알 속이에요 🥚', 1600); return; }
S.sleeping = !S.sleeping;
if (S.sleeping) {
say('쿨쿨... 잘 자요 💤', 2200);
melody([[520,0,.18],[392,180,.32]]);
haptic(8);
} else {
say('잘 잤어! 안녕~ ☀️', 2000);
melody([[523,0],[659,90],[784,180]]);
playAnim('anim-hop', 900);
burstSparkles(6, 50, 45);
haptic(10);
}
save();
}
function medicine() {
if (!S.alive || S.stage === 'egg') return;
if (S.sleeping) { say('자는 중엔 약을 못 먹여요 💤', 1800); return; }
if (S.health >= 95) { say('지금은 건강해요! 💪', 1800); return; }
S.health = clamp(S.health + 28);
say('으웩... 그래도 좀 나아졌어 💊', 2200);
playAnim('anim-shake', 900);
melody([[400,0],[560,110],[700,220]]);
floatText('+28 ❤️', 'rgba(255,140,180,.95)');
burstSparkles(8, 50, 40);
haptic(12);
save();
}
function petPet(
clientX, clientY
) {
if (!S.alive) return;
if (S.stage === 'egg') {
say('톡톡... 안에서 움직여! 🥚', 1600);
beep(500, 0.06, 'triangle', 0.04);
playAnim('anim-love', 700);
haptic(6);
return;
}
if (S.sleeping) {
say('쉿... 자고 있어요 🤫', 1500);
return;
}
S.happiness = clamp(S.happiness + 3);
const happy = S.happiness > 55;
say(happy ? '기분 좋아~ 💕' : '조금만 더 쓰다듬어줘... 🥺', 1400);
beep(880 + Math.random() * 200, 0.07, 'triangle', 0.04);
playAnim('anim-love', 900);
haptic(5);
// heart at touch point
const r = stageEl.getBoundingClientRect();
const el = document.createElement('div');
el.className = 'p rise';
el.textContent = '💕';
el.style.left = ((clientX - r.left) / r.width * 100) + '%';
el.style.top = ((clientY - r.top) / r.height * 100) + '%';
el.style.setProperty('--dx', rand(-30, 30) + 'px');
el.style.filter = 'drop-shadow(0 2px 4px rgba(0,0,0,.3)) drop-shadow(0 0 10px rgba(255,140,190,.9))';
particles.appendChild(el);
setTimeout(() => el.remove(), 1300);
}
/* ========================================================
RENDER ======================================================== */
let renderedPoops = -1;
function setRing(
el, pct
) {
const v = clamp(pct) / 100;
const off = RING_CIRC * (1 - v);
el.style.strokeDasharray = RING_CIRC;
el.style.strokeDashoffset = off;
}
function render() {
// rings
setRing(rings.fullness, S.fullness);
setRing(rings.happiness, S.happiness);
setRing(rings.clean, S.clean);
setRing(rings.energy, S.energy);
// warn states
['fullness','happiness','clean','energy'].forEach(k => {
statEls[k].classList.toggle('warn', S[k] < 22 && S.alive && !S.sleeping);
});
hpText.textContent = '❤️ ' + Math.round(S.health);
ageText.textContent = '⏱ ' + formatAge(S.age);
stageBadge.textContent = STAGES[S.stage];
nameText.textContent = (S.stage === 'egg' ? '🥚 ' : '🐣 ') + S.name;
moodText.textContent = S.alive ? S.mood : '하늘로 갔어요...';
// egg/pet
const isEgg = S.stage === 'egg';
eggSvg.style.display = isEgg ? 'block' : 'none';
petSvg.style.display = isEgg ? 'none' : 'block';
petWrap.style.transform =
`scale(
${STAGE_SCALE[S.stage]}
)`
;
if (!isEgg) {
const sick = S.health < 35;
const sad = S.happiness < 30;
const hungry = S.fullness < 30;
petSvg.classList.toggle('sleeping', S.sleeping);
if (S.sleeping) {
eyesOpen.style.display = 'none';
eyesClosed.style.display = 'block';
eyesX.style.display = 'none';
mouthPath.style.display = 'none';
mouthOpen.style.display = 'none';
mouthTongue.style.display = 'none';
armL.setAttribute('transform', 'rotate(-10 22 76)');
armR.setAttribute('transform', 'rotate(10 98 76)');
} else if (sick) {
eyesOpen.style.display = 'none';
eyesClosed.style.display = 'none';
eyesX.style.display = 'block';
mouthPath.setAttribute('d', 'M50 84 Q60 74 70 84');
mouthPath.style.display = 'block';
mouthOpen.style.display = 'none';
mouthTongue.style.display = 'none';
armL.setAttribute('transform', 'rotate(-30 22 76)');
armR.setAttribute('transform', 'rotate(30 98 76)');
} else {
eyesOpen.style.display = 'block';
eyesClosed.style.display = 'none';
eyesX.style.display = 'none';
mouthPath.style.display = 'block';
mouthOpen.style.display = 'none';
mouthTongue.style.display = 'none';
if (sad) mouthPath.setAttribute('d', 'M50 86 Q60 76 70 86');
else if (hungry) mouthPath.setAttribute('d', 'M53 82 L67 82');
else mouthPath.setAttribute('d', 'M50 78 Q60 90 70 78');
armL.setAttribute('transform', 'rotate(-24 22 76)');
armR.setAttribute('transform', 'rotate(24 98 76)');
}
}
// poops
if (renderedPoops !== S.poops) {
renderedPoops = S.poops;
poopsEl.innerHTML = '';
for (let i = 0; i < S.poops; i++) {
const d = document.createElement('div');
d.className = 'poop';
d.textContent = '💩';
d.style.left = (8 + i * 20 + Math.random() * 4) + '%';
d.style.animationDelay = '0s, ' + (0.5 + i * 0.13) + 's';
poopsEl.appendChild(d);
}
}
// night
stageEl.classList.toggle('night', S.sleeping || !S.alive);
stageEl.classList.toggle('sleeping', S.sleeping);
stageEl.classList.toggle('sick', S.health < 35 && S.alive && !S.sleeping);
// buttons
const egg = isEgg || !S.alive;
btnFeed.disabled = egg;
btnPlay.disabled = egg;
btnWash.disabled = egg;
btnSleep.disabled = egg;
btnSleep.classList.toggle('active', S.sleeping);
btnSleep.querySelector('.emoji').textContent = S.sleeping ? '☀️' : '💤';
btnSleep.childNodes[1].nodeValue = S.sleeping ? '깨우기' : '재우기';
medRow.style.display = (S.alive && !isEgg && S.health < 70) ? 'grid' : 'none';
}
/* ========================================================
PARALLAX + 3D TILT ======================================================== */
let tiltTargetX = 0, tiltTargetY = 0;
let curTiltX = 0, curTiltY = 0;
let parTargetX = 0, parTargetY = 0;
let parX = 0, parY = 0;
const parallaxLayers = Array.from(stageEl.querySelectorAll('[data-parallax]'));
function onPointerMove(
clientX, clientY
) {
const r = device.getBoundingClientRect();
const nx = (clientX - r.left) / r.width - 0.5; // -0.5..0.5
const ny = (clientY - r.top) / r.height - 0.5;
tiltTargetY = nx * 6; // rotateY
tiltTargetX = -ny * 5; // rotateX
parTargetX = -nx * 14;
parTargetY = -ny * 10;
}
function onPointerLeave() {
tiltTargetX = tiltTargetY = 0;
parTargetX = parTargetY = 0;
}
window.addEventListener('pointermove', e => onPointerMove(e.clientX, e.clientY), { passive: true });
device.addEventListener('pointerleave', onPointerLeave);
window.addEventListener('pointerup', onPointerLeave, { passive: true });
function updateParallax() {
curTiltX += (tiltTargetX - curTiltX) * 0.08;
curTiltY += (tiltTargetY - curTiltY) * 0.08;
parX += (parTargetX - parX) * 0.06;
parY += (parTargetY - parY) * 0.06;
device.style.setProperty('--tiltX', curTiltX.toFixed(3) + 'deg');
device.style.setProperty('--tiltY', curTiltY.toFixed(3) + 'deg');
parallaxLayers.forEach(el => {
const k = parseFloat(el.dataset.parallax) || 0.3;
el.style.transform =
`translate3d(
${(parX * k).toFixed(2)}
px,
${(parY * k).toFixed(2)}
px, 0)`
;
});
// pet tilt reacts a bit more
if (petTilt) {
petTilt.style.setProperty('--petTiltX', (-curTiltX * 1.4).toFixed(2) + 'deg');
petTilt.style.setProperty('--petTiltY', (curTiltY * 1.6).toFixed(2) + 'deg');
}
}
/* ========================================================
MAIN LOOP ======================================================== */
let last = performance.now();
let saveAcc = 0;
let idleSparkleAcc = 0;
function loop(now) {
let dt = (now - last) / 1000;
last = now;
if (dt > 0.5) dt = 0.5;
if (S.alive) {
update(dt);
saveAcc += dt;
if (saveAcc > 5) { saveAcc = 0; save(); }
}
// ambient sparkle when happy & awake
if (S.alive && !S.sleeping && S.happiness > 70 && S.stage !== 'egg') {
idleSparkleAcc += dt;
if (idleSparkleAcc > 3.2) {
idleSparkleAcc = 0;
spawnParticle({
kind: 'rise',
char: '✨',
x: rand(30, 70), y: rand(45, 60),
dx: rand(-20, 20),
size: rand(10, 15),
glow: 'rgba(255,220,150,.85)'
});
}
}
updateParallax();
render();
requestAnimationFrame(loop);
}
/* ========================================================
EVENT BINDINGS ======================================================== */
btnFeed.addEventListener('click', feed);
btnPlay.addEventListener('click', play);
btnWash.addEventListener('click', wash);
btnSleep.addEventListener('click', toggleSleep);
btnMed.addEventListener('click', medicine);
stageEl.addEventListener('pointerdown', e => {
if (e.target.closest('.overlay')) return;
if (e.target.closest('.restart-btn')) return;
petPet(e.clientX, e.clientY);
});
$('restartBtn').addEventListener('click', () => {
const sound = S.soundOn;
S = makeDefault();
S.soundOn = sound;
renderedPoops = -1;
overlay.classList.remove('show');
say('새로운 알이 도착했어요! 🥚', 2600);
melody([[523,0],[784,120],[1047,240]]);
screenFlash();
burstSparkles(10, 50, 45);
save();
});
$('nameChip').addEventListener('click', () => {
const n = prompt('펫의 이름을 정해주세요! (최대 8자)', S.name);
if (n && n.trim()) {
S.name = n.trim().slice(0, 8);
say('내 이름은 ' + S.name + '! 😊', 2200);
beep(880, 0.09, 'triangle', 0.05);
save();
}
});
$('nameChip').addEventListener('keydown', e => {
if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.target.click(); }
});
$('soundToggle').addEventListener('click', (e) => {
S.soundOn = !S.soundOn;
e.currentTarget.textContent = S.soundOn ? '🔊' : '🔇';
e.currentTarget.classList.toggle('off', !S.soundOn);
if (S.soundOn) beep(880, 0.08, 'triangle', 0.05);
save();
});
// Keyboard shortcuts
window.addEventListener('keydown', e => {
if (e.target.matches('input, textarea')) return;
switch (e.key) {
case '1': case '!': btnFeed.click(); break;
case '2': case '@': btnPlay.click(); break;
case '3': case '#': btnWash.click(); break;
case '4': case '$': btnSleep.click(); break;
case '5': case '%': if (medRow.style.display !== 'none') btnMed.click(); break;
case ' ': e.preventDefault(); petPet(window.innerWidth/2, window.innerHeight/2); break;
}
});
// Save on exit
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
/* ========================================================
INIT ======================================================== */
load();
buildStars();
buildDecor();
$('soundToggle').textContent = S.soundOn ? '🔊' : '🔇';
$('soundToggle').classList.toggle('off', !S.soundOn);
if (S.alive) {
if (S.stage === 'egg') {
setTimeout(() => say('톡... 톡... 곧 부화할 것 같아요! 🥚', 3000), 700);
} else {
setTimeout(() => say('다시 만나서 반가워, ' + S.name + '! 💕', 2600), 700);
}
} else {
overlay.classList.add('show');
}
renderedPoops = -1;
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
